# ==============================================================================
# DISCRETIZATION SEARCH (cartpole state space)
# ==============================================================================
# report recommendation: prioritize theta and theta_dot resolution
# clamps: x∈[-2.4,2.4], x_dot∈[-3,3], theta∈[-0.209,0.209], theta_dot∈[-3.5,3.5]

# ABLATION STUDY RESULTS (Nov 27, 2025)
# ==============================================================================
# Tested 8 bin configurations with VI and PI on CartPole:
#
# | Bins           | States | VI Return | PI Return | PI Iters |
# |----------------|--------|-----------|-----------|----------|
# | [1,1,6,8]      |     48 |       9.3 |       9.3 |        2 |
# | [2,2,6,8]      |    192 |       9.3 |       9.3 |        2 |
# | [3,3,6,8]      |    432 |       9.2 |       9.2 |        2 |
# | [3,3,8,10]     |    720 |       9.3 |       9.3 |        2 |
# | [3,3,10,12]    |   1080 |      17.0 |      44.9 |        5 |
# | [4,4,10,12] ** |   1920 |      17.5 |     140.4 |        5 | <-- OPTIMAL
# | [3,3,12,16]    |   1728 |      11.1 |      11.1 |        6 |
# | [5,5,12,16]    |   4800 |      11.2 |      11.2 |        5 |
#
# KEY FINDINGS:
# 1. PI significantly outperforms VI (140 vs 17.5 return at optimal bins)
# 2. Sweet spot at [4,4,10,12] (1920 states) - best balance of resolution/sparsity
# 3. More bins ≠ better: [5,5,12,16] (4800 states) underperforms due to sparse transitions
# 4. VI struggles with convergence (918 iters = max limit), PI converges in 2-6 iters
# 5. Position/velocity resolution (x, x_dot) matters - [3,3,*,*] underperforms [4,4,*,*]
#
# OPTIMAL CONFIGURATION: [4, 4, 10, 12] for both VI and PI
# ==============================================================================

discretization:
    # tested configurations (from ablation study)
    tested_configs:
        - [1, 1, 6, 8]      # 48 states - too coarse
        - [2, 2, 6, 8]      # 192 states - still too coarse
        - [3, 3, 6, 8]      # 432 states - original default (poor)
        - [3, 3, 8, 10]     # 720 states - slight improvement
        - [3, 3, 10, 12]    # 1080 states - good for PI
        - [4, 4, 10, 12]    # 1920 states - OPTIMAL
        - [3, 3, 12, 16]    # 1728 states - fine angle but coarse position
        - [5, 5, 12, 16]    # 4800 states - too fine (sparse transitions)
    
    # optimal for VI/PI (from ablation)
    optimal_vi_pi: [4, 4, 10, 12]  # 1920 states, PI return ~140
    
    # recommended for SARSA/Q-Learning (can be finer due to online learning)
    optimal_td: [3, 3, 8, 12]      # 864 states
    
    # conservative (fast, coarse) - NOT RECOMMENDED
    coarse:
        bins_x:             [2, 3, 4]                            # cart position
        bins_x_dot:         [2, 3, 4]                            # cart velocity
        bins_theta:         [4, 6, 8]                            # pole angle (critical)
        bins_theta_dot:     [6, 8, 10]                           # angular velocity (critical)

    # balanced (recommended starting point)
    medium:
        bins_x:             [3, 4, 5]
        bins_x_dot:         [3, 4, 5]
        bins_theta:         [6, 8, 10, 12]
        bins_theta_dot:     [8, 10, 12, 15]

    # fine (slower, higher resolution) - CAUTION: may cause sparse transition issues
    fine:
        bins_x:             [4, 5, 6]
        bins_x_dot:         [4, 5, 6]
        bins_theta:         [10, 12, 15]
        bins_theta_dot:     [12, 15, 20]

# ==============================================================================
# SEARCH PROTOCOL NOTES
# ==============================================================================
# 1. Start with stage1 coarse search: random sample N=24 candidates, run 200 episodes
# 2. Successive halving: discard bottom 50%, add 400 episodes to top 12
# 3. Keep top 8, move to stage2: add 1000 episodes
# 4. Keep top 3, move to stage3: full 10k episodes with 30-50 seeds
# 5. For discretization: pair with medium hyperparams, ablate grid resolution
# 6. Document: ranges, sampling, budgets, wall-clock, final champion + justification
