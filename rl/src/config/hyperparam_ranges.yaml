# STAGE 1: COARSE RANDOM SEARCH (wide ranges, early stopping)
# purpose: eliminate poor configurations quickly
# budget: 200-500 pilot episodes per candidate, keep top 50%
# sampling: log-scale for alpha, linear for gamma/epsilon

stage1:
    sarsa:
        alpha:              [0.01, 0.05, 0.1, 0.3, 0.5]          # learning rate
        gamma:              [0.9, 0.95, 0.99, 0.999]             # discount factor
        epsilon:            [0.05, 0.1, 0.2, 0.3]                # initial exploration
        epsilon_decay:      [0.99, 0.995, 0.999]                 # exploration decay
        epsilon_floor:      [0.005, 0.01, 0.05]                  # minimum exploration

    qlearning:
        alpha:              [0.01, 0.05, 0.1, 0.3, 0.5]          # learning rate
        gamma:              [0.9, 0.95, 0.99, 0.999]             # discount factor
        epsilon:            [0.05, 0.1, 0.2, 0.3]                # initial exploration
        epsilon_decay:      [0.99, 0.995, 0.999]                 # exploration decay
        epsilon_floor:      [0.005, 0.01, 0.05]                  # minimum exploration

    vi:
        gamma:              [0.9, 0.95, 0.99, 0.999]             # discount factor
        theta:              [0.0001, 0.001, 0.01]                # convergence threshold

    pi:
        gamma:              [0.9, 0.95, 0.99, 0.999]             # discount factor
        theta:              [0.0001, 0.001, 0.01]                # convergence threshold

# ==============================================================================
