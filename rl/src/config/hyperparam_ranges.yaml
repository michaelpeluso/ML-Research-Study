# AI Use Statement: hyperparameter search ranges created with GitHub Copilot assistance
# staged hyperparameter search ranges (coarse to fine)

# stage 1: coarse search
stage1:
    sarsa:
        alpha: [0.01, 0.1, 0.5]
        gamma: [0.9, 0.99, 0.999]
        epsilon: [0.05, 0.1, 0.2]

    q_learning:
        alpha: [0.01, 0.1, 0.5]
        gamma: [0.9, 0.99, 0.999]
        epsilon: [0.05, 0.1, 0.2]

# stage 2: medium refinement
stage2:
    sarsa:
        alpha: [0.05, 0.1, 0.15, 0.2]
        gamma: [0.95, 0.99, 0.995]
        epsilon: [0.05, 0.1, 0.15]

    q_learning:
        alpha: [0.05, 0.1, 0.15, 0.2]
        gamma: [0.95, 0.99, 0.995]
        epsilon: [0.05, 0.1, 0.15]

# stage 3: fine tuning
stage3:
    sarsa:
        alpha: [0.08, 0.1, 0.12, 0.15]
        gamma: [0.98, 0.99, 0.995]
        epsilon: [0.08, 0.1, 0.12]

    q_learning:
        alpha: [0.08, 0.1, 0.12, 0.15]
        gamma: [0.98, 0.99, 0.995]
        epsilon: [0.08, 0.1, 0.12]

# discretization search (cartpole)
discretization:
    bins_x: [3, 4, 5, 6]
    bins_x_dot: [3, 4, 5, 6]
    bins_theta: [6, 8, 10, 12]
    bins_theta_dot: [8, 10, 12, 15]
